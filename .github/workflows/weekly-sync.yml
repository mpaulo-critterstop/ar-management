name: Weekly Field Performance Sync

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 6:00 AM UTC = Sunday 12:00 AM CST (UTC-6)
  workflow_dispatch:      # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Field Performance Sync
        run: |
          response=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://hub.critterstop.com/api/cron/field-performance)
          
          echo "HTTP Status: $response"
          echo "Response:"
          cat response.json
          
          if [ "$response" != "200" ]; then
            echo "Sync failed with status $response"
            exit 1
          fi

      - name: Trigger General Sync (AR + Appointments)
        run: |
          response=$(curl -s -o response_general.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://hub.critterstop.com/api/cron/sync")
          
          echo "HTTP Status: $response"
          echo "Response:"
          cat response_general.json
